name: Build Hostinger static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
      - run: npm run package:hostinger
      - uses: actions/upload-artifact@v4
        with:
          name: CropEvidence-hostinger
          path: deploy/CropEvidence-hostinger.zip
      - name: Update the ready-to-host branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/cropevidence-hostinger"
          if git ls-remote --exit-code --heads origin hostinger >/dev/null 2>&1; then
            git worktree add "$target" origin/hostinger
          else
            git worktree add --detach "$target"
            git -C "$target" checkout --orphan hostinger
            git -C "$target" rm -rf .
          fi
          rsync -a --delete --exclude=.git deploy/hostinger/ "$target/"
          git -C "$target" config user.name "github-actions[bot]"
          git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target" add --all
          if git -C "$target" diff --cached --quiet; then
            echo "Built site is unchanged."
          else
            git -C "$target" commit -m "Build site from $SOURCE_SHA"
            git -C "$target" push origin HEAD:hostinger
          fi
